name: Validate proposal
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python tests/validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/field_inventory.py --check
